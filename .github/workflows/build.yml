name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Loại bản build"
        type: choice
        options:
          - debug
          - release
        default: debug
  push:
    branches: [stable, master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout app (ProtoHax-Android)
        uses: actions/checkout@v4

      - name: Checkout core (ProtoHax)
        uses: actions/checkout@v4
        with:
          repository: hax0r31337/ProtoHax
          ref: stable
          submodules: false
          path: ProtoHax-core

      # Lõi ProtoHax dùng JDK 11, app (AGP 8.0.2) cần JDK 17.
      # Cài cả hai; JDK 17 là mặc định, JDK 11 có sẵn qua JAVA_HOME_11_X64.
      - name: Setup JDK 11 + 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            11
            17

      - name: Build and publish core to Maven local (JDK 11)
        working-directory: ProtoHax-core
        run: |
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_11_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          ./gradlew publishToMavenLocal --no-daemon

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build app (JDK 17)
        run: |
          chmod +x gradlew
          TYPE="${{ inputs.build_type || 'debug' }}"
          if [ "$TYPE" = "release" ]; then TASK="app:assembleRelease"; else TASK="app:assembleDebug"; fi
          ./gradlew "$TASK" --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProtoHax-Android-${{ inputs.build_type || 'debug' }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
